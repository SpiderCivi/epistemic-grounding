name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print environment
        run: |
          echo "--- Environment ---"
          node -v || true
          bun -v || true
          uname -a || true
          echo "-------------------"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node deps
        run: |
          npm ci --prefer-offline --no-audit

      - name: Run full check (typecheck, lint, tests)
        run: npm run check
